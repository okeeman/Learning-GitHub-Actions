name: my-first-workflow
# To trigger on any push to this repo in any branch.
on: 
  # Put trigger on next line (after on:) and with colon if more than one.
  push:
  schedule:
     # Execute every 5 minutes.
    - cron: "5 * * * *"
  # This trigger allows for manual execution.
  workflow_dispatch: 

# Jobs are executed in parallel.
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    # Steps are executed in sequence.
    steps: 
    - name: Step-1
      run: |
        pwd 
        ls -ltr
        hostname
    - name: Step-2 - Checkout
      uses: actions/checkout@v7.0.1
    - name: Step-3
      run: |
        echo 'pwd' >> myartifact.txt
        mkdir artifacts
        echo 'ls -ltr' >> artifacts/list.txt
        echo 'hostname' >> artifacts/hostname.txt
    - name: Upload single file
      uses: actions/upload-artifact@v7
      # Inputs.
      with:
        name: single_file
        path: ./myartifact.txt
    - name: Upload from directory.
      uses: actions/upload-artifact@v7
      with:
        name: directory_artifacts
        path: artifacts/
    - name: Upload from multiple paths.
      uses: actions/upload-artifact@v7
      with:
        name: multiple_paths
        path: |
          ./myartifact.txt
          artifacts/
    - name: Upload from multiple paths with exclusions.
      uses: actions/upload-artifact@v5.0.0
      with:
        name: multiple_paths_exclusions
        path: |
          ./myartifact.txt
          artifacts/
          # Exclude, do not upload, anywhere in this file path, this file.
          !**/hostname.txt
  job2:
      name: JOB2
      needs: job1
      runs-on: ubuntu-latest
      steps:
      - name: Checking current directory.
        run: |
          pwd
          ls -ltr
      - name: Download single file artifact.
        # Changed from v7 to older version to see if that will work for single file download.
        uses: actions/download-artifact@v5.0.0
        with:
          # Name in this file, not the file name.
          name: single_file
      - name: Checking current directory post download.
        run: |
          pwd
          ls -ltr
  job3:
      name: JOB3
      needs: job1
      runs-on: ubuntu-latest
      steps:
      - name: Checking current directory.
        run: |
          pwd
          ls -ltr
      - name: Download single file artifact.
       # Changed from v7 to older version to see if that will work for single file download.
        uses: actions/download-artifact@v5.0.0
        with:
          # Name in this file, not the file name.
          name: single_file
          path: single_file
      - name: Download directory.
        uses: actions/download-artifact@v5.0.0
        with:
          name: directory_artifacts
          path: download_directory
      - name: Checking current directory post download.
        run: |
          pwd
          ls -ltr
  job4:
      name: JOB4
      needs: job1
      runs-on: ubuntu-latest
      steps:
      - name: Creating custom folder for download.
        run: |
          mkdir -p single_file
          mkdir -p download_directory
      - name: Checking current directory.
        run: |
          pwd
          ls -ltr
      - name: Download directory.
        uses: actions/download-artifact@v5.0.0
        with:
          name: directory_artifacts
      - name: Checking current directory post download.
        run: |
          pwd
          echo "Checking single file directory"
         ls -ltr single_file
         echo "Checking directory artifacts"
         ls -ltr download_directory
          
        
   
