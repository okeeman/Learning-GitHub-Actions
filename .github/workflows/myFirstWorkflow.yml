name: my-first-workflow
on: 
  push:
    branches:
      - main
      - dev
  pull_request: 
    branches:
      - main

jobs:
  unit_test:
    name: Running Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          mkdir reports/
          pytest --junitxml=reports/unit-test-results.xml -cov=. --cov-report=xml --cov-report=term-missing -v
      - name: Upload code coverage report
        uses: actions/upload-artifact@v5.0.0
        with:
          name: unit-test-report
          path: reports/
  code-ql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions: 
      actions: read
      contents: read
      security-events: write # Required to upload the analysis results.
    strategy: 
      matrix:
        language: ['python']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{matrix.languages}}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "security"
  build:
     name: Build image
     runs-on: ubuntu-latest
     needs: [code-ql]
     if: success()
     outputs:
       image-tags: ${{steps.vars.outputs.IMAGE_TAGS}}
     steps:
       - name: Checkout code
         uses: actions/checkout@v7
       - name: Setup Docker buildx
         uses: docker/setup-buildx-action@3.0.0
       - name: Generate image tags
         id: vars
         run: |
           IMAGE_TAGS = "${{github.run_id}}-$GITHUB_SHA::7"
           # new output file.
           echo "IMAGE_TAGS=$IMAGE_TAGS" >> $GITHUB_OUTPUT
       - name: Build image (no push)
         uses: docker/build-push-action@v5.0.0
         with:
           # context is current directory.
           context: .
           file: ./Dockerfile
           push: false
           tags: my-first-app:${{steps.vars.outputs.IMAGE_TAGS}}
       - name: Save Docker image
         run: docker save my-first-app:${{steps.vars.outputs.IMAGE_TAGS}} -o thinknyx_app.tar
       - name: Upload Docker image
         uses: actions/upload-artifact@v5.0.0
         with: 
           name: thinknyx_app_image
           path: thinknyx_app.tar









          
          
      
  
